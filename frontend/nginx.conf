# Overrides the stock nginx:alpine default of `worker_processes auto;`.
#
# "auto" makes nginx spawn one worker per CPU core it detects — but in
# containerized hosts (Railway included) that detection can read the
# *host* machine's core count instead of the container's actual CPU
# allocation. That's why deploy logs showed ~72 worker processes starting
# on a service that likely has 1-2 vCPUs allocated: each one is basically
# idle, just adding memory overhead for no throughput benefit.
#
# Pin it to a small fixed number instead. 2 is plenty for a static-file
# SPA behind Railway's own edge/proxy layer; bump this only if you've
# confirmed (via Railway's resource metrics) that nginx itself is CPU
# constrained, not just the request volume.
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    include /etc/nginx/conf.d/*.conf;
}
